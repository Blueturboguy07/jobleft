<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create an account to apply (practice page)</title><link rel="stylesheet" href="/practice/_style.css"><script src="/practice/_log.js"></script></head>
<body>
<div class="wrap">
  <h1>Create your candidate account</h1><div class="company">Practice Careers · step 1 of 3 (an account wall)</div>
  <form id="signup" action="/apply/account" method="post">
    <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email"></div>
    <div class="field"><label for="fname">First name</label><input id="fname" name="fname" type="text"></div>
    <div class="field"><label for="lname">Last name</label><input id="lname" name="lname" type="text"></div>
    <div class="field"><label for="pw">Password</label><input id="pw" name="pw" type="password"></div>
    <div class="field"><label for="pw2">Verify new password</label><input id="pw2" name="pw2" type="password"></div>
    <div class="field"><label><input type="checkbox" id="terms" name="terms"> I agree to the terms</label></div>
    <button class="btn" type="submit">Create Account</button> <button class="btn" type="button" data-next>Next</button>
  </form>
</div>
</body></html>
