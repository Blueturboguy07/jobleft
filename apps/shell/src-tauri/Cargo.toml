[package]
name = "jobleft-shell"
version = "0.1.11"
description = "jobleft desktop shell: starts the local server as a sidecar, opens the window, lives in the menu bar"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "jobleft_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# Apply links and "Original posting" open in the default browser: WKWebView swallows window.open and target=_blank
# without it (found 2026-09-27).
tauri-plugin-opener = "2"
serde_json = "1"
# The launch token: 32 random bytes from the operating system, on every platform.
getrandom = "0.3"
# Signed self-update (src/updates.rs, docs/updates.md). 2.14.1 at least: `requireSignedVersion` (the signature must
# name the version the feed announces) needs it, and it needs Rust 1.90 (rust-version above).
tauri-plugin-updater = "2.14.1"
# The update questions ("Restart" / "Later") and the result of "Check for Updates…".
tauri-plugin-dialog = "2.8.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows has no osascript: alerts go through the notification plugin (a toast) there.
tauri-plugin-notification = "2"
