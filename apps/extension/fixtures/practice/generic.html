<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Volunteer coordinator - hand-made form (practice)</title><link rel="stylesheet" href="/practice/_style.css"><script src="/practice/_log.js"></script></head>
<body>
<div class="wrap">
  <h1>Volunteer Coordinator</h1><div class="company">A hand-made form that matches no known system</div>
  <form action="/apply/generic" method="post">
    <table>
      <tr><td>Your name</td><td><input name="n1" type="text" aria-label="Your name"></td></tr>
      <tr><td>E-mail</td><td><input name="n2" type="text" aria-label="E-mail"></td></tr>
      <tr><td>Telephone</td><td><input name="n3" type="text" aria-label="Telephone"></td></tr>
      <tr><td>Town</td><td><input name="n4" type="text" aria-label="Town"></td></tr>
      <tr><td>Postcode</td><td><input name="n5" type="text" aria-label="Postcode"></td></tr>
    </table>
    <div class="field"><label for="cv">Attach your CV</label><input id="cv" name="cv" type="file"></div>
    <div class="field"><label for="motivation">Why do you want to volunteer with us?</label><textarea id="motivation" name="motivation"></textarea></div>
    <button class="btn" type="submit">Send</button>
  </form>
</div>
</body></html>
