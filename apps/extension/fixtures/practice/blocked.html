<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>A job board page (practice, used under a blocked host name)</title><link rel="stylesheet" href="/practice/_style.css"><script src="/practice/_log.js"></script></head>
<body>
<div class="wrap">
  <h1>Easy apply (practice)</h1>
  <form action="/apply/blocked" method="post">
    <div class="field"><label for="fn">First name</label><input id="fn" name="fn" type="text"></div>
    <div class="field"><label for="em">Email</label><input id="em" name="em" type="email"></div>
    <div class="field"><label for="cv">Resume</label><input id="cv" name="cv" type="file"></div>
    <button class="btn" type="submit">Submit</button>
  </form>
</div>
</body></html>
