<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Embedded application form (practice)</title><link rel="stylesheet" href="/practice/_style.css"><script src="/practice/_log.js"></script></head>
<body>
<div class="wrap">
  <h2>Apply for this Job</h2>
  <form id="application_form" action="/apply/frame" method="post">
    <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="job_application[first_name]" type="text" required></div>
    <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="job_application[last_name]" type="text" required></div>
    <div class="field"><label for="email">Email *</label><input id="email" name="job_application[email]" type="text" required></div>
    <div class="field"><label for="resume">Resume/CV *</label><input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx"></div>
    <button class="btn" type="submit">Submit Application</button>
  </form>
</div>
</body></html>
