# Typecheck and unit tests on macOS and Windows. No secrets, no network beyond the package registry,
# no live job-board requests (every test uses fakes or local mock servers).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5


      # No pnpm cache here: setup-node's cache step fails on Windows with the pnpm shim path (2026-09-27).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # pnpm from npm: pnpm/action-setup's shim was a silent no-op on windows-latest (pnpm printed nothing, installed
      # nothing, and every pnpm step 'passed' in seconds). The version is the one in package.json's packageManager.
      - name: pnpm
        shell: bash
        run: |
          npm install -g pnpm@12.4.1
          v=$(pnpm --version)
          echo \"pnpm $v\"
          test \"$v\" = \"12.4.1\"

      # --ignore-scripts: no dependency install script runs (rule 5, see pnpm-workspace.yaml).
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
