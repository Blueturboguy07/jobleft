# Typecheck and unit tests on macOS and Windows. No secrets, no network beyond the package registry,
# no live job-board requests (every test uses fakes or local mock servers).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # the version comes from package.json's packageManager
        with:
          standalone: true # a real pnpm binary: the .bin shim breaks under cmd.exe on Windows

      # No pnpm cache here: setup-node's cache step fails on Windows with the pnpm shim path (2026-09-27).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # --ignore-scripts: no dependency install script runs (rule 5, see pnpm-workspace.yaml).
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
