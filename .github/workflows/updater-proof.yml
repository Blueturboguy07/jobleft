# Proves the signed self-updater end to end on clean GitHub runners. Never run on a desk Mac. Adapted from the publik
# template (GSpot).
#
# Builds jobleft N (0.0.1) and N+1 (0.0.2) with the commands of publik-build.yml, compiled to read their update feed
# from http://127.0.0.1:$FEED_PORT/latest.json (PUBLIK_UPDATE_ENDPOINT at build time; plain HTTP on loopback needs
# dangerousInsecureTransportProtocol, set for these test builds only). Then, on macos-latest and windows-latest:
# install N, serve the feed in the job, and run N's updater self-test (PUBLIK_UPDATE_SELF_TEST,
# apps/shell/src-tauri/src/updates.rs) against
#   - a feed whose signature is from another key        -> refused, N stays on disk
#   - a feed whose package has one byte changed          -> refused, N stays on disk
#   - a feed that announces a version the signature does not name -> refused, N stays on disk
#   - the good feed                                      -> N+1 installed, the app on disk reports N+1
# macOS also checks that the updated app keeps the bundle id, the signing certificate and the designated requirement
# (what TCC permissions are bound to). The runner has no Developer ID, so both macOS builds are signed with one
# throwaway certificate, in the order of apps/shell/scripts/build-macos.sh (apps/shell/test/updater/proof-macos.sh).
# jobleft runs a local service (node) from the app: on Windows the good update runs with that service up, and on
# macOS the "yes" answer is taken with it up and jobleft must come back as N+1 with a working service.
# The builds carry no publik app token (no sign-in gate), and publikhq.com is blocked on the proof runners.
# Nothing is published: no release, no tag. Results: the job summaries and the updater-proof-* artifacts.
name: updater-proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: '1'
  PUBLIK_NO_AUTO_UPDATE: '1'
  FEED_PORT: '47390'
  N: '0.0.1'
  N1: '0.0.2'

jobs:
  # The Rust unit test of the shipped updater config (the real feed over https, the key, the strict checks).
  unit:
    name: Shipped updater config (cargo test)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: pnpm
        shell: bash
        run: |
          npm install -g pnpm@12.4.1
          test "$(pnpm --version)" = "12.4.1"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri
          shared-key: updater-proof-unit

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # tauri::generate_context! needs the bundle inputs (the node binary and the sidecar tree) to exist.
      - name: Bundle inputs
        run: |
          pnpm --filter @jobleft/ui build
          node apps/shell/scripts/fetch-node.mjs --target darwin-arm64
          node apps/shell/scripts/pack.ts --target darwin-arm64

      - name: cargo test
        working-directory: apps/shell/src-tauri
        run: cargo test --lib -- --nocapture

  build-macos:
    name: Build macOS ${{ matrix.version }}
    strategy:
      matrix:
        version: ['0.0.1', '0.0.2']
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: pnpm
        shell: bash
        run: |
          npm install -g pnpm@12.4.1
          test "$(pnpm --version)" = "12.4.1"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri
          shared-key: updater-proof-macos

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the UI
        run: pnpm --filter @jobleft/ui build

      - name: Node runtime for the sidecar
        run: node apps/shell/scripts/fetch-node.mjs --target darwin-arm64

      - name: Sidecar tree (no publik app token)
        run: node apps/shell/scripts/pack.ts --target darwin-arm64

      # The publik-build.yml command (no updater artifacts: the release packs the update bundle after Developer ID
      # signing), plus the test version and the loopback feed.
      - name: Build jobleft.app ${{ matrix.version }}
        shell: bash
        env:
          PUBLIK_UPDATE_ENDPOINT: http://127.0.0.1:${{ env.FEED_PORT }}/latest.json
          VERSION: ${{ matrix.version }}
        run: |
          printf '{"version":"%s","bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"dangerousInsecureTransportProtocol":true}}}' "$VERSION" > "$RUNNER_TEMP/proof.conf.json"
          cd apps/shell
          cli="$(node -p "require.resolve('@tauri-apps/cli/tauri.js', { paths: ['.'] })")"
          node "$cli" build --bundles app --config "$RUNNER_TEMP/proof.conf.json"
          cd ../..
          APP=apps/shell/src-tauri/target/release/bundle/macos/jobleft.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          lipo -archs "$APP/Contents/MacOS/jobleft"
          test -x "$APP/Contents/MacOS/node"
          grep -q -a -F "127.0.0.1:$FEED_PORT/latest.json" "$APP/Contents/MacOS/jobleft"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/jobleft-$VERSION.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos-${{ matrix.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-windows:
    name: Build Windows ${{ matrix.version }}
    strategy:
      matrix:
        version: ['0.0.1', '0.0.2']
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: pnpm
        shell: bash
        run: |
          npm install -g pnpm@12.4.1
          test "$(pnpm --version)" = "12.4.1"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri
          shared-key: updater-proof-windows

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the UI
        run: pnpm --filter @jobleft/ui build

      - name: Node runtime for the sidecar
        run: node apps/shell/scripts/fetch-node.mjs --target win-x64

      - name: Sidecar tree (no publik app token)
        run: node apps/shell/scripts/pack.ts --target win-x64

      # The windows.yml command with the update key: tauri build writes the installer and its .sig.
      - name: Build the installer ${{ matrix.version }}
        shell: pwsh
        env:
          PUBLIK_UPDATE_ENDPOINT: http://127.0.0.1:${{ env.FEED_PORT }}/latest.json
          VERSION: ${{ matrix.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { Write-Error "The TAURI_SIGNING_PRIVATE_KEY secret is not set."; exit 1 }
          $cfg = Join-Path $env:RUNNER_TEMP "proof.conf.json"
          '{"version":"' + $env:VERSION + '","plugins":{"updater":{"dangerousInsecureTransportProtocol":true}}}' | Set-Content $cfg -Encoding ascii
          Set-Location apps/shell
          $cli = node -p "require.resolve('@tauri-apps/cli/tauri.js', { paths: ['.'] })"
          node $cli build --bundles nsis --config $cfg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force ..\..\dist | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/jobleft_$($env:VERSION)_x64-setup.exe", "src-tauri/target/release/bundle/nsis/jobleft_$($env:VERSION)_x64-setup.exe.sig" ..\..\dist\
          Get-ChildItem ..\..\dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ matrix.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  proof-macos:
    name: Proof on macos-latest
    needs: build-macos
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # For the Tauri CLI (tauri signer): the release pack script signs with it.
      - name: Install
        shell: bash
        run: |
          npm install -g pnpm@12.4.1
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Block publikhq.com, so a test can not touch production
        run: |
          echo "127.0.0.1 publikhq.com www.publikhq.com" | sudo tee -a /etc/hosts
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true

      - uses: actions/download-artifact@v4
        with:
          pattern: build-macos-*
          path: builds
          merge-multiple: true

      - name: Unpack N and N+1
        run: |
          uname -m; sw_vers
          mkdir -p unpacked/N unpacked/N1
          ditto -x -k "builds/jobleft-$N.app.zip" unpacked/N
          ditto -x -k "builds/jobleft-$N1.app.zip" unpacked/N1

      - name: Prove the updater
        timeout-minutes: 30
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash apps/shell/test/updater/proof-macos.sh unpacked/N/jobleft.app unpacked/N1/jobleft.app out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-proof-macos
          path: out/
          retention-days: 30

  proof-windows:
    name: Proof on windows-latest
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # For the Tauri CLI (tauri signer), which makes the foreign-key signature.
      - name: Install
        shell: bash
        run: |
          npm install -g pnpm@12.4.1
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Block publikhq.com, so a test can not touch production
        shell: pwsh
        run: Add-Content -Path "$env:SystemRoot\System32\drivers\etc\hosts" -Value "`n127.0.0.1 publikhq.com`n127.0.0.1 www.publikhq.com"

      - uses: actions/download-artifact@v4
        with:
          pattern: build-windows-*
          path: builds
          merge-multiple: true

      - name: Prove the updater
        shell: pwsh
        timeout-minutes: 30
        run: |
          [System.Environment]::OSVersion.VersionString
          $n = (Get-Item "builds/jobleft_$($env:N)_x64-setup.exe").FullName
          $n1 = (Get-Item "builds/jobleft_$($env:N1)_x64-setup.exe").FullName
          pwsh -NoProfile -File apps/shell/test/updater/proof-windows.ps1 -N $n -N1 $n1 -Out out
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-proof-windows
          path: out/
          retention-days: 30
