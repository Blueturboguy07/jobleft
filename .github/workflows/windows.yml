# Windows: the workspace's tests on windows-latest, then the NSIS installer (the Windows shell with the Node sidecar),
# installed silently on the runner and proven to start, answer health and stop. On a published release, or on
# workflow_dispatch with a tag, the installer is attached to that release, but only when the release has no installer
# of that name yet: a file that is already on a release is never replaced (a release can be made with checked files
# first, see publik-build.yml). No secrets beyond the public app token.
# The packaged app starts with Sign in with publik (the publik module's gate): every step that starts it points the
# gate at the repo's publik stand-in on the runner (PUBLIK_ORIGIN), and passes the gate with qa/bin/publik-gate-pass.mjs.
# Nothing reaches publikhq.com.
name: windows

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the installer to this existing release tag (optional)"
        required: false
      installer_run_id:
        description: "Replay only, against the jobleft-windows-setup artifact of this earlier run (skips the build; optional)"
        required: false

permissions:
  contents: write
  actions: read # the replay may download the installer of an earlier run

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

# The app that these jobs install and start is a test copy on a runner, not a person: it sends no usage counts
# (README, "Usage counts").
env:
  DO_NOT_TRACK: '1'

jobs:
  windows:
    if: github.event.inputs.installer_run_id == ''
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      installer: ${{ steps.smoke.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5


      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # pnpm from npm: pnpm/action-setup's shim was a silent no-op on windows-latest (pnpm printed nothing, installed
      # nothing, and every pnpm step 'passed' in seconds). The version is the one in package.json's packageManager.
      - name: pnpm
        shell: bash
        run: |
          npm install -g pnpm@12.4.1
          v=$(pnpm --version)
          echo \"pnpm $v\"
          test \"$v\" = \"12.4.1\"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Pacer diagnostic (why two pacers on one database fire too close on this runner)
        shell: pwsh
        continue-on-error: true
        run: node qa/bin/pacer-diag.mjs

      - name: Tests on Windows
        id: tests
        continue-on-error: true # the installer, the smoke and the replay still run; the job fails at the end
        shell: pwsh
        # Every workspace package's suite, one node --test each, with a per-test time limit and a forced exit: a hang
        # or a lingering handle shows up as a named failure, never as a silent 90-minute job (pnpm -r cannot pass these flags).
        run: |
          $failed = @()
          foreach ($dir in (Get-ChildItem -Path packages, apps -Directory)) {
            if (-not (Test-Path (Join-Path $dir.FullName 'test'))) { continue }
            if (-not (Get-ChildItem -Path (Join-Path $dir.FullName 'test') -Filter '*.test.ts' -ErrorAction SilentlyContinue)) { continue }
            "`n===== $($dir.FullName)"
            Push-Location $dir.FullName
            node --test --test-timeout=180000 --test-force-exit "test/*.test.ts"
            if ($LASTEXITCODE -ne 0) { $failed += $dir.Name }
            Pop-Location
          }
          "`n===== failed suites: $($failed -join ', ')"
          if ($failed.Count -gt 0) { exit 1 }

      - name: Build the UI
        run: pnpm --filter @jobleft/ui build

      - name: Node runtime for the sidecar
        run: node apps/shell/scripts/fetch-node.mjs --target win-x64

      - name: Layout of node_modules on this runner
        shell: pwsh
        run: |
          "root node_modules/.pnpm: $(Test-Path node_modules/.pnpm)"
          "apps/ui/node_modules/vite: $(Test-Path apps/ui/node_modules/vite)"
          node -e "console.log('vite ->', require.resolve('vite/package.json', { paths: ['apps/ui'] }))"

      - name: Sidecar tree
        env:
          JOBLEFT_PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: node apps/shell/scripts/pack.ts --target win-x64

      - name: Build the installer
        shell: pwsh
        run: |
          Set-Location apps/shell
          $cli = node -p "require.resolve('@tauri-apps/cli/tauri.js', { paths: ['.'] })"
          "tauri cli: $cli"
          node $cli build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Smoke: install, start, health, stop"
        id: smoke
        shell: pwsh
        env:
          JOBLEFT_PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }} # the stand-in accepts the token the app ships with
        run: |
          $setup = Get-ChildItem -Path apps/shell/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          "installer: $($setup.Name) ($([math]::Round($setup.Length/1MB)) MB)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\jobleft\jobleft.exe"
          if (-not (Test-Path $exe)) { $exe = (Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter 'jobleft.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          "installed at: $exe"
          # The app signs in with publik at start: a stand-in on the runner takes that (health answers behind the gate).
          $standin = Start-Process -FilePath node -ArgumentList 'qa/bin/publik-standin.mjs','47990' -PassThru -RedirectStandardOutput standin0.out -RedirectStandardError standin0.err
          Start-Sleep -Seconds 3
          "stand-in: $(Get-Content standin0.out -ErrorAction SilentlyContinue) $(Get-Content standin0.err -ErrorAction SilentlyContinue)"
          $env:PUBLIK_ORIGIN = 'http://127.0.0.1:47990'
          $env:JOBLEFT_PUBLIK_BASE_URL = 'http://127.0.0.1:47990/api/v1'
          $env:JOBLEFT_AUTO_CRAWL = '0'
          $env:JOBLEFT_SEED_BOARDS = 'none'
          $p = Start-Process -FilePath $exe -PassThru
          $run = "$env:APPDATA\jobleft\run\server.json"
          $deadline = (Get-Date).AddSeconds(40)
          while (-not (Test-Path $run) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $run)) { Get-Content "$env:APPDATA\jobleft\logs\sidecar.log" -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "no run/server.json after 40 s" }
          $j = Get-Content $run | ConvertFrom-Json
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:$($j.port)/api/v1/health"
          "health: $($health | ConvertTo-Json -Compress)"
          if ($health.app -ne 'jobleft') { throw "health did not answer jobleft" }
          $shellFile = "$env:APPDATA\jobleft\run\shell.json"
          $deadline = (Get-Date).AddSeconds(20)
          while (-not (Test-Path $shellFile) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          "window: $(if (Test-Path $shellFile) { Get-Content $shellFile } else { 'no run/shell.json (window not reported)' })"
          $window = if (Test-Path $shellFile) { (Get-Content $shellFile | ConvertFrom-Json).windowShown } else { $false }
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($j.port)/api/v1/shutdown" -Headers @{ 'x-jobleft-token' = $j.token } -ContentType 'application/json' -Body '{}' | Out-Null
          Start-Sleep -Seconds 4
          # A server that answers is not enough: users saw a cmd window and no app window (the shell gave up first).
          if ($window -ne $true) { Get-Content "$env:APPDATA\jobleft\logs\sidecar.log" -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "the app window did not open (run/shell.json windowShown is not true)" }
          $alive = Get-Process -Id $j.pid -ErrorAction SilentlyContinue
          if ($alive) { throw "server still running after shutdown" }
          "server stopped cleanly; run file gone: $(-not (Test-Path $run))"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $standin.Id -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:LOCALAPPDATA\publik\apps\jobleft.json" -Force -ErrorAction SilentlyContinue

      # The two defects behind "linked to publik, but the plan is never used" on Windows (0.1.3): the publik key died
      # with the local service, and plan money that arrived on publikhq.com never showed up without a click. Against the
      # repo's own publik stand-in (nothing reaches publikhq.com): sign in at the gate (the person has a plan: "Connect
      # your plan"), read a top-up with no click, quit, start the installed app again: the stored answer passes the gate
      # with no click, still connected, ONE install.
      - name: "Smoke: the publik connection survives a restart"
        id: restart
        continue-on-error: true # the verdict comes at the end, like the suites': the installer and the replay still run
        shell: pwsh
        env:
          JOBLEFT_PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: |
          if (-not $env:JOBLEFT_PUBLIK_APP_TOKEN) { "no app token on this runner (a fork?): the packaged app has no token file, so Connect answers 'not available'. Skipped."; exit 0 }
          $standin = Start-Process -FilePath node -ArgumentList 'qa/bin/publik-standin.mjs','47991' -PassThru -RedirectStandardOutput standin.out -RedirectStandardError standin.err
          Start-Sleep -Seconds 3
          "stand-in: $(Get-Content standin.out -ErrorAction SilentlyContinue) $(Get-Content standin.err -ErrorAction SilentlyContinue)"
          $admin = 'http://127.0.0.1:47991/__admin'
          $exe = "$env:LOCALAPPDATA\jobleft\jobleft.exe"
          if (-not (Test-Path $exe)) { $exe = (Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter 'jobleft.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          $env:JOBLEFT_AUTO_CRAWL = '0'
          $env:JOBLEFT_SEED_BOARDS = 'none'
          $env:PUBLIK_ORIGIN = 'http://127.0.0.1:47991'
          $env:JOBLEFT_PUBLIK_BASE_URL = 'http://127.0.0.1:47991/api/v1'
          Remove-Item "$env:LOCALAPPDATA\publik\apps\jobleft.json" -Force -ErrorAction SilentlyContinue
          $run = "$env:APPDATA\jobleft\run\server.json"
          function Start-App {
            $p = Start-Process -FilePath $exe -PassThru
            $deadline = (Get-Date).AddSeconds(60)
            while (-not (Test-Path $run) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path $run)) { Get-Content "$env:APPDATA\jobleft\logs\sidecar.log" -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "no run/server.json after 60 s" }
            $j = Get-Content $run | ConvertFrom-Json
            return @{ app = $p; port = $j.port; token = $j.token }
          }
          function Stop-App($a) {
            try { Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($a.port)/api/v1/shutdown" -Headers @{ 'x-jobleft-token' = $a.token } -ContentType 'application/json' -Body '{}' | Out-Null } catch { "shutdown route: $_" }
            Start-Sleep -Seconds 4
            Stop-Process -Id $a.app.Id -Force -ErrorAction SilentlyContinue
            Remove-Item $run -Force -ErrorAction SilentlyContinue
          }
          # The person has a plan (the stand-in holds $8.05) and signs in in the browser: the gate says Connect your plan.
          Invoke-RestMethod -Method Post -Uri "$admin/add" -ContentType 'application/json' -Body '{"usd":8.05}' | Out-Null
          $a = Start-App
          $h = @{ 'x-jobleft-token' = $a.token }
          node qa/bin/publik-gate-pass.mjs --port $a.port --token $a.token --admin $admin --action connect
          if ($LASTEXITCODE -ne 0) { Stop-App $a; Stop-Process -Id $standin.Id -Force -ErrorAction SilentlyContinue; throw "the sign-in gate did not pass" }
          $c = Invoke-RestMethod -Uri "http://127.0.0.1:$($a.port)/api/v1/publik" -Headers $h
          "after the gate: state=$($c.state) claim=$($c.wallet.claimState) balance=$($c.wallet.balanceMicros)"
          if ($c.state -ne 'connected') { Stop-App $a; Stop-Process -Id $standin.Id -Force -ErrorAction SilentlyContinue; throw "Connect your plan did not connect (state=$($c.state))" }
          # More plan money arrives on publikhq.com: the app shows it with no click (it reads the balance again after 20 s).
          Invoke-RestMethod -Method Post -Uri "$admin/add" -ContentType 'application/json' -Body '{"usd":1}' | Out-Null
          Start-Sleep -Seconds 22
          $w = Invoke-RestMethod -Uri "http://127.0.0.1:$($a.port)/api/v1/publik" -Headers $h
          "after the web top-up, no click: claim=$($w.wallet.claimState) balance=$($w.wallet.balanceMicros)"
          Stop-App $a
          # Quit and start again (a reboot, an update and a slow first start do the same): the stored answer passes the
          # gate with no click; still connected, one install.
          $b = Start-App
          $h = @{ 'x-jobleft-token' = $b.token }
          node qa/bin/publik-gate-pass.mjs --port $b.port --token $b.token --wait-s 30
          if ($LASTEXITCODE -ne 0) { Stop-App $b; Stop-Process -Id $standin.Id -Force -ErrorAction SilentlyContinue; throw "the gate asked again after a restart" }
          $s = Invoke-RestMethod -Uri "http://127.0.0.1:$($b.port)/api/v1/publik" -Headers $h
          "after a restart: state=$($s.state) claim=$($s.wallet.claimState) balance=$($s.wallet.balanceMicros)"
          $st = Invoke-RestMethod -Method Post -Uri "$admin/price" -ContentType 'application/json' -Body '{"usd":0.01}'
          "stand-in installs minted: $($st.keys)"
          Stop-App $b
          Stop-Process -Id $standin.Id -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:LOCALAPPDATA\publik\apps\jobleft.json" -Force -ErrorAction SilentlyContinue
          if ($c.wallet.claimState -ne 'claimed' -or $c.wallet.balanceMicros -ne 8050000) { throw "Connect your plan did not show the plan (claim=$($c.wallet.claimState) balance=$($c.wallet.balanceMicros))" }
          if ($w.wallet.balanceMicros -ne 9050000) { throw "the balance screen did not see the web top-up without a click (balance=$($w.wallet.balanceMicros))" }
          if ($s.state -ne 'connected') { throw "the publik connection did not survive a restart (state=$($s.state)): the sign-in was not kept" }
          if ($st.keys -ne 1) { throw "a second publik install was minted after the restart (installs: $($st.keys))" }

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: jobleft-windows-setup
          path: apps/shell/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'release') { '${{ github.event.release.tag_name }}' } else { '${{ github.event.inputs.release_tag }}' }
          $setup = Get-ChildItem -Path apps/shell/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          # Never replace a file that is already on the release (no --clobber): it may be the checked one.
          $have = @(gh release view $tag --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "could not read the assets of release $tag; nothing was uploaded" }
          if ($have -contains $setup.Name) { "release $tag already has $($setup.Name): left as it is, nothing uploaded"; exit 0 }
          gh release upload $tag $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The verdict on the suites comes last: the installer, its smoke and the release attach never wait on a flaky test.
      - name: Test result
        if: steps.tests.outcome == 'failure' || steps.restart.outcome == 'failure'
        run: |
          echo "a test suite failed on Windows (see the Tests on Windows step): ${{ steps.tests.outcome }}; the publik restart smoke: ${{ steps.restart.outcome }}"
          exit 1

  # The black-box replay: the scenario scripts the Mac testers wrote (qa/scenarios) run on Windows against the
  # installed app, on a first run (onboarding), then after a live crawl of 12 boards (every other surface).
  replay:
    needs: windows
    if: always() && (needs.windows.outputs.installer == 'true' || github.event.inputs.installer_run_id != '')
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5


      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # pnpm from npm: pnpm/action-setup's shim was a silent no-op on windows-latest (pnpm printed nothing, installed
      # nothing, and every pnpm step 'passed' in seconds). The version is the one in package.json's packageManager.
      - name: pnpm
        shell: bash
        run: |
          npm install -g pnpm@12.4.1
          v=$(pnpm --version)
          echo \"pnpm $v\"
          test \"$v\" = \"12.4.1\"

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the extension
        run: pnpm --filter @jobleft/extension build

      - uses: actions/download-artifact@v4
        with:
          name: jobleft-windows-setup
          path: setup
          run-id: ${{ github.event.inputs.installer_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install the app and start it (12 starting boards)
        shell: pwsh
        env:
          JOBLEFT_PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }} # the stand-in accepts the token the app ships with
        run: |
          $setup = Get-ChildItem -Path setup -Filter '*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\jobleft\jobleft.exe"
          if (-not (Test-Path $exe)) { $exe = (Get-ChildItem -Path "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter 'jobleft.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName }
          "installed at: $exe"
          # Sign in with publik at the stand-in (nothing reaches publikhq.com); the scenarios then connect publik themselves.
          $standin = Start-Process -FilePath node -ArgumentList 'qa/bin/publik-standin.mjs','47993' -PassThru -RedirectStandardOutput standin.out -RedirectStandardError standin.err
          Start-Sleep -Seconds 3
          "stand-in: $(Get-Content standin.out -ErrorAction SilentlyContinue) $(Get-Content standin.err -ErrorAction SilentlyContinue)"
          $env:PUBLIK_ORIGIN = 'http://127.0.0.1:47993'
          $env:JOBLEFT_PUBLIK_BASE_URL = 'http://127.0.0.1:47993/api/v1'
          Remove-Item "$env:LOCALAPPDATA\publik\apps\jobleft.json" -Force -ErrorAction SilentlyContinue
          $env:JOBLEFT_SEED_LIMIT = '12'
          $env:JOBLEFT_LOG_LEVEL = 'debug' # the app's logs go into the artifact
          $p = Start-Process -FilePath $exe -PassThru
          $run = "$env:APPDATA\jobleft\run\server.json"
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $run) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path $run)) { Get-Content "$env:APPDATA\jobleft\logs\sidecar.log" -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "no run/server.json after 60 s" }
          $j = Get-Content $run | ConvertFrom-Json
          node qa/bin/publik-gate-pass.mjs --port $j.port --token $j.token --admin 'http://127.0.0.1:47993/__admin' --action own_key
          if ($LASTEXITCODE -ne 0) { throw "the sign-in gate did not pass" }
          # Still in this step: is the app there 10 s after the gate passed? (It was gone by the next step on 2026-11-11.)
          Start-Sleep -Seconds 10
          "10 s after the gate: shell alive=$([bool](Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) stand-in alive=$([bool](Get-Process -Id $standin.Id -ErrorAction SilentlyContinue))"
          try { "10 s after the gate: health $((Invoke-WebRequest -Uri "http://127.0.0.1:$($j.port)/api/v1/health" -UseBasicParsing).StatusCode)" } catch { "10 s after the gate: health $($_.Exception.Message)" }
          "JOBLEFT_STANDIN_PID=$($standin.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "JOBLEFT_QA_URL=http://127.0.0.1:$($j.port)/#token=$($j.token)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "JOBLEFT_QA_API=http://127.0.0.1:$($j.port)/api/v1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "JOBLEFT_QA_TOKEN=$($j.token)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "JOBLEFT_QA_EXTENSION=$env:GITHUB_WORKSPACE\apps\extension\dist" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "JOBLEFT_QA_SHOTS=$env:GITHUB_WORKSPACE\qa\shots" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "JOBLEFT_APP_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "app pid $($p.Id), server on port $($j.port)"

      - name: First run (onboarding)
        id: onboarding
        continue-on-error: true
        env:
          JOBLEFT_QA_STATE: fresh
        run: node qa/bin/run-all.mjs onboarding

      # What the app did around the sign-in and the first run: whether the shell, the local service and the stand-in
      # are still there, and the tails of the app's own logs (the scenarios above only see the HTTP side).
      - name: App state after the first run
        if: always()
        shell: pwsh
        run: |
          "shell pid $env:JOBLEFT_APP_PID alive: $([bool](Get-Process -Id $env:JOBLEFT_APP_PID -ErrorAction SilentlyContinue))"
          "stand-in pid $env:JOBLEFT_STANDIN_PID alive: $([bool](Get-Process -Id $env:JOBLEFT_STANDIN_PID -ErrorAction SilentlyContinue))"
          "run/server.json present: $(Test-Path "$env:APPDATA\jobleft\run\server.json")"
          try { "health: $((Invoke-WebRequest -Uri "$env:JOBLEFT_QA_API/health" -UseBasicParsing).StatusCode)" } catch { "health: $($_.Exception.Message)" }
          Get-Process -Name jobleft,node -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,StartTime | Format-Table | Out-String
          "--- logs/sidecar.log (last 80 lines)"
          Get-Content "$env:APPDATA\jobleft\logs\sidecar.log" -Tail 80 -ErrorAction SilentlyContinue
          "--- logs/server.log (last 80 lines)"
          Get-Content "$env:APPDATA\jobleft\logs\server.log" -Tail 80 -ErrorAction SilentlyContinue
          "--- stand-in"
          Get-Content standin.out,standin.err -ErrorAction SilentlyContinue

      - name: Jobs from live boards
        id: crawl
        continue-on-error: true
        run: node qa/bin/wait-for-jobs.mjs

      - name: Every other surface
        id: rest
        continue-on-error: true
        env:
          JOBLEFT_QA_STATE: golden
        run: node qa/bin/run-all.mjs feed tracker resume network settings extension

      # The logs are copied under qa/shots first: upload-artifact refuses two roots (the workspace and the profile).
      - name: Collect the app's logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path qa/shots/app-logs | Out-Null
          Copy-Item "$env:APPDATA\jobleft\logs\*" qa/shots/app-logs -ErrorAction SilentlyContinue
          Copy-Item standin.out,standin.err qa/shots/app-logs -ErrorAction SilentlyContinue

      - name: Keep the screenshots and the app's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobleft-windows-replay
          if-no-files-found: ignore
          path: qa/shots

      - name: Stop the app
        if: always()
        shell: pwsh
        run: |
          try { Invoke-RestMethod -Method Post -Uri "$env:JOBLEFT_QA_API/shutdown" -Headers @{ 'x-jobleft-token' = $env:JOBLEFT_QA_TOKEN } -ContentType 'application/json' -Body '{}' | Out-Null } catch { "shutdown route: $_" }
          Start-Sleep -Seconds 3
          if ($env:JOBLEFT_APP_PID) { Stop-Process -Id $env:JOBLEFT_APP_PID -Force -ErrorAction SilentlyContinue }
          if ($env:JOBLEFT_STANDIN_PID) { Stop-Process -Id $env:JOBLEFT_STANDIN_PID -Force -ErrorAction SilentlyContinue }

      - name: Result
        if: steps.onboarding.outcome == 'failure' || steps.crawl.outcome == 'failure' || steps.rest.outcome == 'failure'
        run: |
          echo "a replay step failed: onboarding=${{ steps.onboarding.outcome }} crawl=${{ steps.crawl.outcome }} rest=${{ steps.rest.outcome }}"
          exit 1
